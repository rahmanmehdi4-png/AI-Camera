name: Validate V2.2 Development
on:
  push:
    branches: [codex/v2-2-usability-overhaul]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: v2-2-development-website
          path: dist/
          if-no-files-found: error
          retention-days: 7
